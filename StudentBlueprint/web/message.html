<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{title}} | Student Blueprint</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar"><span class="logo">Student Blueprint</span></header>
<!-- simple message page, used for "not found" and "choose a career first" -->
<main class="narrow">
    <div class="card">
        <h1>{{title}}</h1>
        <p>{{message}}</p>
        <a class="button" href="{{link}}">{{linkText}}</a>
    </div>
</main>
</body>
</html>
